trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: AZURE_SUBSCRIPTION
  value: 'b127d0c6-3b4e-48e9-b991-dc8522af2d0f'
- name: AZURE_CONTAINER_REGISTRY
  value: 'fincyairegistry'
- name: DOCKER_IMAGE_NAME
  value: 'fincy-ai'
- name: KUBERNETES_NAMESPACE
  value: 'fincy-ai-prod'
- name: KUBERNETES_CLUSTER_NAME
  value: 'fincy-ai-cluster'

stages:
- stage: Build
  displayName: 'Build and Containerize'
  jobs:
  - job: Build
    displayName: 'Build and Push Container'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'
    - script: |
        npm install
        npm run build
      displayName: 'npm install and build'
    - task: Docker@2
      inputs:
        command: 'buildAndPush'
        repository: '$(DOCKER_IMAGE_NAME)'
        dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        containerRegistry: '$(AZURE_CONTAINER_REGISTRY)'
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: 'Deploy to Kubernetes'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: 'Deploy to AKS'
    steps:
    - task: Kubernetes@1
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: '$(AZURE_SUBSCRIPTION)'
        azureResourceGroup: 'fincy-ai-rg'
        kubernetesCluster: '$(KUBERNETES_CLUSTER_NAME)'
        command: 'apply'
        useConfigurationFile: true
        configuration: '$(Build.SourcesDirectory)/k8s/deployment.yaml'
        secretType: 'dockerRegistry'
        containerRegistryType: 'Azure Container Registry'
        dockerRegistryEndpoint: '$(AZURE_CONTAINER_REGISTRY)' 