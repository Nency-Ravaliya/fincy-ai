trigger:
  - main

variables:
  # Azure Resource Group and Region
  AZURE_RESOURCE_GROUP: 'fincy-ai-rg'
  AZURE_LOCATION: 'eastus'
  
  # Azure Container Registry
  ACR_NAME: 'fincyairegistry'
  IMAGE_NAME: 'fincy-ai'
  
  # AKS Cluster
  AKS_CLUSTER_NAME: 'fincy-ai-cluster'
  NAMESPACE: 'fincy-ai-prod'

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build and Push Image'
  jobs:
  - job: BuildAndPush
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        npm install
        npm run build
      displayName: 'npm install and build'

    - task: Docker@2
      inputs:
        containerRegistry: 'ACR'
        repository: '$(IMAGE_NAME)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest
      displayName: 'Build and Push Docker Image'

- stage: Deploy
  displayName: 'Deploy to AKS'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to AKS'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            inputs:
              action: 'createSecret'
              kubernetesServiceConnection: 'aks-connection'
              namespace: '$(NAMESPACE)'
              secretType: 'dockerRegistry'
              secretName: 'acr-auth'
              dockerRegistryEndpoint: 'ACR'

          - task: KubernetesManifest@0
            inputs:
              action: 'deploy'
              kubernetesServiceConnection: 'aks-connection'
              namespace: '$(NAMESPACE)'
              manifests: |
                k8s/deployment.yaml
              containers: |
                $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)

          - task: Kubernetes@1
            inputs:
              connectionType: 'Azure Resource Manager'
              azureSubscriptionEndpoint: 'Azure Subscription'
              azureResourceGroup: '$(AZURE_RESOURCE_GROUP)'
              kubernetesCluster: '$(AKS_CLUSTER_NAME)'
              command: 'get'
              arguments: 'pods -n $(NAMESPACE)'
              useClusterAdmin: true 